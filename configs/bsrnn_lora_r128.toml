# BSRNN LoRA finetuning config for singing voice separation
# Mirrors the structure of lora_attn_nin_finetune.toml but targets BSRNN.

# Dataset configuration
base_dir = "/media/netdata/CUDA/datasets/MSS_datasets"
format = "MSS"
dataset_str = "musmoisdb"
target_str = "vocals"
samples_per_track = 24
random_mix = true
add_augmentation = true
full_mix_percentage = 0.5
use_musdb_test_as_valid = false
custom_valid_dir = "./se2svs_results_and_audio/gensvs_eval_audio"

# Training runtime configuration
start_with_validation = false
batch_size = 14
num_workers = 16
max_epochs = 550
accelerator = "gpu"
devices = "auto"
accumulate_grad_batches = 1

# Optimization
lr = 5e-5
weight_decay = 0.0
si_sdr_loss_weight = 0.8

# Audio / STFT configuration
train_mono = true
duration = 5.0
sr = 48000
n_fft = 960
hop_length = 480
window = "hann"
normalize = "not"
transform_type = "exponent"

# BSRNN architecture and LoRA finetuning setup
bsrnn_num_channel = 196
bsrnn_num_layer = 6
finetune_mode = "lora"
pretrained_ckpt = "./checkpoints/bsrnn_pretrained/bsrnn.ckpt"

# LoRA configuration
lora_r = 128
lora_alpha = 256
lora_dropout = 0.005
lora_bias = "none"
# Leave null to auto-discover BSRNN target module names in code
lora_target_modules = []
# Optional extra modules to keep trainable alongside LoRA adapters
lora_modules_to_save = []
print_lora_candidates_only = false

# Logging
wandb_name = "bsrnn_lora_finetune_r128_a256"
run_id = "260701_BSRNN_lora_finetune_r128_a256"
audio_log_interval = 6
audio_log_files = [1, 3, 4, 11, 19, 26, 29]
save_ckpt_interval = 50000
