# LoRA Finetuning Configuration for Singing Voice Separation
# This config uses Low-Rank Adaptation to adapt the speech enhancement model
# for singing voice separation while preserving original capabilities

# Dataset configuration
base_dir = "/media/netdata/CUDA/datasets/MSS_datasets"
format = "MSS"
samples_per_track = 24
dataset_str = "musmoisdb"
random_mix = true
add_augmentation = true
target_str = "vocals"
full_mix_percentage = 0.5
use_musdb_test_as_valid = false
custom_valid_dir = "./test_sets/gensvs_eval_audio"

# Backbone configuration - using LoRA variant
backbone = "ncsnpp_48k_lora"

# Pretrained checkpoint to load BEFORE applying LoRA
lora_pretrained_checkpoint = "./checkpoints/sgmse_pretrained/ears_wham.ckpt"

# LoRA-specific hyperparameters
lora_r = 16                          # LoRA rank (lower = fewer params, typically 4-16)
lora_alpha = 32                     # LoRA scaling factor (usually 2*r)
lora_dropout = 0.005                  # Dropout for LoRA layers (0 = no dropout)
lora_target_modules = ["resnet_dense", "resnet_conv"] 
lora_attn_nin = false

# Training configuration
start_with_validation = false
audio_log_interval = 6
batch_size = 3
lr = 2e-4
train_mono = true
num_workers = 10
sr = 48000
num_eval_files = 50
valid_sep_dir = "./test_sets/gensvs_eval_audio"
audio_log_files = [1, 3, 4, 11, 19, 26, 29]
max_epochs = 550

# Logging and experiment tracking
wandb_name = "sgmse_lora_finetune_w_attn_r16"
run_id = "270226_1600_SGMSE_lora_finetune_w_attn_r16"

# STFT parameters
n_fft = 1534
hop_length = 384
spec_factor = 0.065
spec_abs_exponent = 0.667

# SDE parameters
sigma_min = 0.1
sigma_max = 1.0
theta = 2.0

